workflows:
  native-android:
    name: Native Android Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - keystore_reference
      vars:
        PACKAGE_NAME: "com.supersnippets.dailyme"
      java: 21
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android release APK and AAB
        script: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease -Pandroid.injected.version.code=$BUILD_NUMBER
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/apk/release/*.apk
